name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the phone and watch debug APKs and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Check the APKs are complete, readable and signed with the shared key
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in app/build/outputs/apk/debug/*.apk wear/build/outputs/apk/debug/*.apk; do
            echo "== $(basename "$apk"): $(stat -c %s "$apk") bytes, SHA-256 $(sha256sum "$apk" | cut -c1-16)…"
            "$BT/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|uses-feature: name='android.hardware.type.watch')"
            "$BT/apksigner" verify --verbose --print-certs "$apk" | grep -E "^(Verified using|Signer #1 certificate SHA-256)"
          done

      - name: Check the database schema is committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::The Room schema changed. Commit app/schemas and add a Migration for the new version."
            git status --porcelain app/schemas
            git diff app/schemas
            git ls-files --others --exclude-standard app/schemas | while read -r f; do echo "== $f"; cat "$f"; echo; done
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KK-Fittracking-phone-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload watch debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KK-Fittracking-watch-debug-apk
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KK-Fittracking-test-reports
          path: app/build/reports/tests/
